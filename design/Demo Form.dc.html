<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html { color-scheme: light dark; }
  body { margin: 0; font-family: "IBM Plex Sans", system-ui, sans-serif; background: light-dark(#F7F9F8, #0A0E0C); }
  * { box-sizing: border-box; }
  input, select { font: inherit; }
</style>
</helmet>

<div style="background: light-dark(#FFFFFF, #121815); border: 1px solid light-dark(#E1E7E4, #1F2925); border-radius: 14px; padding: 32px;">
  <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 14px; padding: 28px 0; min-height: 380px; justify-content: center;">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: light-dark(#15803D, #22C55E);">REQUEST RECEIVED</div>
      <h3 style="font-family: 'Newsreader', serif; font-weight: 400; font-size: 28px; letter-spacing: -0.015em; margin: 0; color: light-dark(#0B120F, #E9EFEC);">Thank you — we will be in touch.</h3>
      <p style="margin: 0; font-size: 15.5px; line-height: 1.6; color: light-dark(#5C665F, #8C978F);">We reply within one working day, usually with two or three times to choose from.</p>
    </div>
  </sc-if>

  <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
  <div style="display: flex; flex-direction: column; gap: 18px;">
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 18px;">
      <label style="display: flex; flex-direction: column; gap: 7px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.11em; color: light-dark(#7A857D, #79847C);">NAME</span>
        <input type="text" placeholder="Grace Wanjiru" value="{{ name }}" onChange="{{ setName }}" style="border: 1px solid light-dark(#DDE4E0, #26312C); border-radius: 7px; padding: 11px 13px; font-size: 15px; background: light-dark(#FFFFFF, #0E1412); color: light-dark(#0B120F, #E9EFEC); outline: none;" style-focus="border-color: light-dark(#15803D, #22C55E);" />
      </label>
      <label style="display: flex; flex-direction: column; gap: 7px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.11em; color: light-dark(#7A857D, #79847C);">COMPANY</span>
        <input type="text" placeholder="Rift Valley Safaris" value="{{ company }}" onChange="{{ setCompany }}" style="border: 1px solid light-dark(#DDE4E0, #26312C); border-radius: 7px; padding: 11px 13px; font-size: 15px; background: light-dark(#FFFFFF, #0E1412); color: light-dark(#0B120F, #E9EFEC); outline: none;" style-focus="border-color: light-dark(#15803D, #22C55E);" />
      </label>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 18px;">
      <label style="display: flex; flex-direction: column; gap: 7px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.11em; color: light-dark(#7A857D, #79847C);">WORK EMAIL</span>
        <input type="email" placeholder="grace@rvsafaris.co.ke" value="{{ email }}" onChange="{{ setEmail }}" style="border: 1px solid light-dark(#DDE4E0, #26312C); border-radius: 7px; padding: 11px 13px; font-size: 15px; background: light-dark(#FFFFFF, #0E1412); color: light-dark(#0B120F, #E9EFEC); outline: none;" style-focus="border-color: light-dark(#15803D, #22C55E);" />
      </label>
      <label style="display: flex; flex-direction: column; gap: 7px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.11em; color: light-dark(#7A857D, #79847C);">PHONE</span>
        <input type="tel" placeholder="+254 700 000 000" value="{{ phone }}" onChange="{{ setPhone }}" style="border: 1px solid light-dark(#DDE4E0, #26312C); border-radius: 7px; padding: 11px 13px; font-size: 15px; background: light-dark(#FFFFFF, #0E1412); color: light-dark(#0B120F, #E9EFEC); outline: none;" style-focus="border-color: light-dark(#15803D, #22C55E);" />
      </label>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 18px;">
      <label style="display: flex; flex-direction: column; gap: 7px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.11em; color: light-dark(#7A857D, #79847C);">FLEET SIZE</span>
        <select value="{{ fleet }}" onChange="{{ setFleet }}" style="border: 1px solid light-dark(#DDE4E0, #26312C); border-radius: 7px; padding: 11px 13px; font-size: 15px; background: light-dark(#FFFFFF, #0E1412); color: light-dark(#0B120F, #E9EFEC); outline: none;" style-focus="border-color: light-dark(#15803D, #22C55E);">
          <option value="1-3">1–3 vehicles</option>
          <option value="4-10">4–10 vehicles</option>
          <option value="11-25">11–25 vehicles</option>
          <option value="25+">25+ vehicles</option>
          <option value="none">We subcontract vehicles</option>
        </select>
      </label>
      <label style="display: flex; flex-direction: column; gap: 7px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.11em; color: light-dark(#7A857D, #79847C);">BOOKINGS PER MONTH</span>
        <select value="{{ volume }}" onChange="{{ setVolume }}" style="border: 1px solid light-dark(#DDE4E0, #26312C); border-radius: 7px; padding: 11px 13px; font-size: 15px; background: light-dark(#FFFFFF, #0E1412); color: light-dark(#0B120F, #E9EFEC); outline: none;" style-focus="border-color: light-dark(#15803D, #22C55E);">
          <option value="1-10">Up to 10</option>
          <option value="11-30">11–30</option>
          <option value="31-75">31–75</option>
          <option value="75+">More than 75</option>
        </select>
      </label>
    </div>
    <button onClick="{{ submit }}" style="margin-top: 6px; background: light-dark(#15803D, #22C55E); color: light-dark(#FFFFFF, #04120A); border: none; font-size: 15px; font-weight: 600; padding: 15px 22px; border-radius: 8px; cursor: pointer;" style-hover="background: light-dark(#116330, #34D96F);">Request a demo</button>
    <p style="margin: 0; font-size: 13px; line-height: 1.5; color: light-dark(#8A938C, #6A746D);">No pricing pages, no card. We reply within one working day.</p>
  </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:540}}">
class Component extends DCLogic {
  state = { sent: false, name: "", company: "", email: "", phone: "", fleet: "4-10", volume: "11-30" };
  set(k) { return (e) => this.setState({ [k]: e.target.value }); }
  renderVals() {
    return {
      sent: this.state.sent,
      notSent: !this.state.sent,
      name: this.state.name,
      company: this.state.company,
      email: this.state.email,
      phone: this.state.phone,
      fleet: this.state.fleet,
      volume: this.state.volume,
      setName: this.set("name"),
      setCompany: this.set("company"),
      setEmail: this.set("email"),
      setPhone: this.set("phone"),
      setFleet: this.set("fleet"),
      setVolume: this.set("volume"),
      submit: () => this.setState({ sent: true })
    };
  }
}
</script>
</body>
</html>
